name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Qt Desktop
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtmultimedia qtconnectivity'
        cache: false
    
    - name: Install Qt Android
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia qtconnectivity'
        cache: false
    
    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.1.8937393"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Build OpenSSL for Android
      run: |
        wget https://github.com/openssl/openssl/releases/download/openssl-3.0.13/openssl-3.0.13.tar.gz
        tar -xzf openssl-3.0.13.tar.gz
        cd openssl-3.0.13
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        ./Configure android-arm64 -D__ANDROID_API__=23 --prefix=$GITHUB_WORKSPACE/openssl-android no-shared
        make -j$(nproc)
        make install_sw
    
    - name: Fix duplicate main issue
      run: |
        # Remove the main function from transaction.cpp or exclude it from build
        if grep -q "Crypto/transaction.cpp" FastPayQt.pro; then
          sed -i 's/Crypto\/transaction.cpp/# Crypto\/transaction.cpp/' FastPayQt.pro
        fi
    
    - name: Update pro file with OpenSSL
      run: |
        OPENSSL_PATH="$GITHUB_WORKSPACE/openssl-android"
        if ! grep -q "OPENSSL" FastPayQt.pro; then
          echo "" >> FastPayQt.pro
          echo "INCLUDEPATH += $OPENSSL_PATH/include" >> FastPayQt.pro
          echo "LIBS += -L$OPENSSL_PATH/lib -lssl -lcrypto" >> FastPayQt.pro
        fi
    
    - name: Build APK
      run: |
        qmake FastPayQt.pro -spec android-clang "CONFIG+=release"
        make -j$(nproc)
        make apk
    
    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "No APK found"
          find . -type f -name "*.apk" -o -name "*.aab"
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FastPay-Android-APK
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30