name: Build Android APK

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main, master ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.pro'
      - 'CMakeLists.txt'
      - 'server_config.h'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia qtconnectivity'
        cache: false
    
    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.1.8937393"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Configure environment
      run: |
        export QT_HOST_PATH="${Qt6_DIR}/../gcc_64"
        echo "QT_HOST_PATH=$QT_HOST_PATH" >> $GITHUB_ENV
        echo "Qt Android: $Qt6_DIR"
        echo "Android SDK: $ANDROID_SDK_ROOT"
        echo "Android NDK: $ANDROID_NDK_ROOT"
    
    - name: Build APK with androiddeployqt
      run: |
        # Use Qt's androiddeployqt tool instead
        $Qt6_DIR/bin/qmake FastPayQt.pro -spec android-clang "CONFIG+=release"
        make -j$(nproc)
        
        # Create android deployment
        $Qt6_DIR/bin/androiddeployqt \
          --input android-FastPayQt-deployment-settings.json \
          --output android-build \
          --android-platform android-33 \
          --jdk $JAVA_HOME \
          --gradle
    
    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" -o -name "*.aab" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "No APK/AAB found! Listing build directory:"
          find . -type f -name "*.apk" -o -name "*.aab" -o -name "*.so"
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK at: $APK_PATH"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FastPay-Android-APK
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30
    
    - name: Build Summary
      run: |
        echo "### Build Successful! " >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**APK Location:** ${{ steps.find_apk.outputs.apk_path }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY