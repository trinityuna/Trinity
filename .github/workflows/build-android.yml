name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Qt Desktop
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtmultimedia qtconnectivity'
        cache: false
    
    - name: Install Qt Android
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia qtconnectivity'
        cache: false
    
    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.1.8937393"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Build OpenSSL for Android
      run: |
        wget https://github.com/openssl/openssl/releases/download/openssl-3.0.13/openssl-3.0.13.tar.gz
        tar -xzf openssl-3.0.13.tar.gz
        cd openssl-3.0.13
        
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        
        # Configure OpenSSL for Android with shared libraries
        ./Configure android-arm64 -D__ANDROID_API__=23 --prefix=$GITHUB_WORKSPACE/openssl-android shared no-tests
        
        # Build OpenSSL
        make -j$(nproc)
        
        # Install OpenSSL
        make install_sw
        
        # Verify shared libraries were created
        echo "Checking for shared libraries..."
        ls -lh $GITHUB_WORKSPACE/openssl-android/lib/
        
        # Find the correct Qt Android directory
        QT_ANDROID_DIR="${Qt6_DIR/gcc_64/android_arm64_v8a}"
        echo "Qt Android directory: $QT_ANDROID_DIR"
        
        # Create lib directory if it doesn't exist
        mkdir -p $QT_ANDROID_DIR/lib
        
        # Copy shared libraries with the correct names to Android Qt directory
        if [ -f "$GITHUB_WORKSPACE/openssl-android/lib/libssl.so.3" ]; then
          echo "Copying OpenSSL shared libraries to Android Qt directory..."
          cp $GITHUB_WORKSPACE/openssl-android/lib/libssl.so.3 $QT_ANDROID_DIR/lib/libssl_3.so
          cp $GITHUB_WORKSPACE/openssl-android/lib/libcrypto.so.3 $QT_ANDROID_DIR/lib/libcrypto_3.so
          cp $GITHUB_WORKSPACE/openssl-android/lib/libssl.so $QT_ANDROID_DIR/lib/
          cp $GITHUB_WORKSPACE/openssl-android/lib/libcrypto.so $QT_ANDROID_DIR/lib/
          echo "✅ OpenSSL libraries copied successfully"
          ls -lh $QT_ANDROID_DIR/lib/libssl* $QT_ANDROID_DIR/lib/libcrypto*
        else
          echo "❌ Error: OpenSSL shared libraries not found!"
          exit 1
        fi
    
    - name: Fix duplicate main issue
      run: |
        if grep -q "Crypto/transaction.cpp" FastPayQt.pro; then
          sed -i 's/Crypto\/transaction.cpp/# Crypto\/transaction.cpp/' FastPayQt.pro
        fi
    
    - name: Update pro file with OpenSSL
      run: |
        OPENSSL_PATH="$GITHUB_WORKSPACE/openssl-android"
        QT_ANDROID_DIR="${Qt6_DIR/gcc_64/android_arm64_v8a}"
        
        if ! grep -q "OPENSSL" FastPayQt.pro; then
          echo "" >> FastPayQt.pro
          echo "INCLUDEPATH += $OPENSSL_PATH/include" >> FastPayQt.pro
          echo "LIBS += -L$OPENSSL_PATH/lib -lssl -lcrypto" >> FastPayQt.pro
          echo "android {" >> FastPayQt.pro
          echo "    ANDROID_EXTRA_LIBS += $QT_ANDROID_DIR/lib/libssl_3.so $QT_ANDROID_DIR/lib/libcrypto_3.so" >> FastPayQt.pro
          echo "}" >> FastPayQt.pro
        fi
        
        echo "Updated FastPayQt.pro:"
        tail -10 FastPayQt.pro
    
    - name: Build APK
      run: |
        qmake FastPayQt.pro -spec android-clang "CONFIG+=release"
        make -j$(nproc)
        make apk
    
    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "No APK found, searching for all package files..."
          find . -type f \( -name "*.apk" -o -name "*.aab" \)
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
        ls -lh "$APK_PATH"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FastPay-Android-APK
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30
    
    - name: Build Summary
      run: |
        echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Your FastPay Android APK is ready!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download it from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY